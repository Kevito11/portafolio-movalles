<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15221b"/>
      <stop offset="100%" stop-color="#0a100d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc8"/>
      <stop offset="45%" stop-color="#d8c58f"/>
      <stop offset="100%" stop-color="#b89f63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e2"/>
      <stop offset="100%" stop-color="#dfcb95"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded container with gold border -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#d8c58f" stroke-width="2" stroke-opacity="0.85" fill="none"/>

  <!-- Portfolio Briefcase Handle -->
  <path d="M23 18.5V14.5C23 12.567 24.567 11 26.5 11H37.5C39.433 11 41 12.567 41 14.5V18.5" 
        stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Briefcase Main Body -->
  <rect x="10" y="18.5" width="44" height="32.5" rx="6" fill="url(#gold)"/>

  <!-- Top Flap Section -->
  <path d="M10 19.5H54V28L33.8 35.2C32.65 35.6 31.35 35.6 30.2 35.2L10 28V19.5Z" fill="url(#accent)"/>

  <!-- Flap Divider Line -->
