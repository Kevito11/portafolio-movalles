  <rect x="29.5" y="33.5" width="5" height="3.5" rx="1" fill="#d8c58f"/>
  <circle cx="32" cy="38.5" r="0.9" fill="#d8c58f"/>

  <!-- Bottom Corner Accents -->
  <path d="M10 44C10 47.9 13.1 51 17 51H20V44H10Z" fill="#a48c53" fill-opacity="0.4"/>
  <path d="M54 44C54 47.9 50.9 51 47 51H44V44H54Z" fill="#a48c53" fill-opacity="0.4"/>
</svg>